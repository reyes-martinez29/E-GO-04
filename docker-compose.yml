services:
  nats:
    image: nats:2.11-alpine
    container_name: hotsale-nats-go04  # distinto al de E-Go03 para que no choquen
    # -js: habilita JetStream; -sd: almacenamiento en disco (el stream vive en archivo, no en RAM)
    # -m 8222: endpoint de monitoreo HTTP (http://localhost:8222/jsz)
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  nats-data:
